<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaraKaiwa-日本語 Voice Practice</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet" />
  <!-- Set the theme before first paint: saved preference, else system. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('app_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { /* default to light */ }
    })();
  </script>
  <!-- Live2D Cubism Core is proprietary (not on npm) — vendored as a classic script -->
  <script src="%sveltekit.assets%/vendor/live2dcubismcore.min.js"></script>
  <link rel="stylesheet" href="%sveltekit.assets%/assets/style.css" />
  %sveltekit.head%
</head>

<body>
  <!-- display:contents so body's flex column layout still applies to the app's
       direct children (header, .card) exactly as before SvelteKit -->
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
